<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="page-sketch-project-root" content="/">
  <title>V4 页面还原草图</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #edf3fb; background: #0c1420; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 720px; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 16px; background: #172438; border-bottom: 1px solid #344861; }
    h1 { margin: 0 auto 0 0; font-size: 17px; }
    button, input { font: inherit; }
    button { padding: 7px 11px; color: #fff; background: #28598d; border: 1px solid #6d9fd1; border-radius: 5px; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input[type=text] { width: 160px; padding: 7px 8px; color: #f5f8fc; background: #0d1828; border: 1px solid #58718e; border-radius: 5px; }
    #page-status { min-width: 230px; font-size: 13px; color: #c7d5e5; }
    main { min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 12px; padding: 12px; }
    #stage-frame { position: relative; min-width: 0; min-height: 360px; overflow: hidden; display: grid; place-items: center; background-color: #172536; background-image: linear-gradient(45deg,#1f3043 25%,transparent 25%),linear-gradient(-45deg,#1f3043 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1f3043 75%),linear-gradient(-45deg,transparent 75%,#1f3043 75%); background-size: 28px 28px; background-position: 0 0,0 14px,14px -14px,-14px 0; border: 1px solid #405670; }
    #stage-surface { position: absolute; left: 0; top: 0; transform-origin: top left; background: #101827; overflow: hidden; }
    #resource-errors { max-height: 45vh; overflow: auto; padding: 10px; background: #182538; border: 1px solid #465a72; border-radius: 6px; font-size: 13px; }
    #resource-errors h2 { margin: 0 0 8px; font-size: 14px; }
    #resource-errors ul { margin: 0; padding-left: 20px; color: #ffb3a9; }
    #resource-errors:empty { display: none; }
    footer { padding: 8px 14px; color: #aabbd0; font-size: 12px; background: #121d2c; border-top: 1px solid #344861; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } #resource-errors { max-height: 22vh; } }
  </style>
</head>
<body>
  <header>
    <h1>V4 页面还原草图</h1>
    <button id="open-sketch" type="button">打开 page-sketch.json</button>
    <button id="toggle-preview" type="button" disabled aria-pressed="false">预览正式效果</button>
    <button id="save-sketch" type="button" disabled>保存草图</button>
    <label for="confirmed-by">确认人</label>
    <input id="confirmed-by" type="text" autocomplete="name" placeholder="填写你的名字或身份" disabled>
    <button id="confirm-sketch" type="button" disabled>确认草图</button>
    <span id="page-status" role="status" aria-live="polite">请从游戏项目开发服务打开此页面并加载草图。</span>
  </header>
  <main>
    <section id="stage-frame" aria-label="正式资源草图预览画布">
      <div id="stage-surface"></div>
    </section>
    <aside id="resource-errors" aria-live="polite"></aside>
  </main>
  <footer>拖动节点框或输入父级相对坐标微调；点击“预览正式效果”可隐藏参考图和编辑面板无遮挡查看组合。所有源文件 SHA 与确认内容都会复核；无法预览的正式资源会阻止确认。</footer>
  <script type="module">
    import { initializePageSketchApplication } from "./page-sketch-editor.mjs";

    const rootPath = document.querySelector('meta[name="page-sketch-project-root"]')?.content || "/";
    await initializePageSketchApplication({ document, projectRootUrl: new URL(rootPath, location.href) });
  </script>
</body>
</html>
